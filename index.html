<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gouache Paint</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div class="brand">
    <svg width="28" height="28" viewBox="0 0 28 28" aria-hidden="true"><rect x="1" y="1" width="26" height="26" rx="7" fill="var(--accent)"/><path d="M7 19c3-1 4-8 8-9s5 4 6 6" fill="none" stroke="var(--accent-fg)" stroke-width="3" stroke-linecap="round"/><circle cx="19" cy="9" r="2.5" fill="#f5c400"/></svg>
    <h1>Gouache</h1>
  </div>
  <div class="actions">
  </div>
</header>

<div class="app">
  <div class="stage" id="stage">
    <div class="paper" id="paper" data-cursor="ring">
      <canvas id="main" width="1400" height="900"></canvas>
      <canvas id="overlay" width="1400" height="900"></canvas>
      <div class="ring" id="ring" hidden></div>
    </div>
  </div>
  <aside class="panel">
    <section class="sec">
      <h2>Colour</h2>
      <div class="current">
        <div class="big" id="bigSwatch"></div>
        <div>
          <div class="hex" id="colorHex">#2B3FB8</div>
        </div>
        <label class="btn custom" title="Pick any colour">Custom<input type="color" id="picker" value="#2b3fb8"></label>
      </div>
      <div class="swatches" id="swatches"></div>
    </section>
    <section class="sec">
      <h2 id="optTitle">Brush</h2>
      <div class="row" id="rowSize"><label for="size">Size</label><input type="range" id="size" min="1" max="160" value="14"><output id="sizeOut">14</output></div>
      <div class="row" id="rowOpacity"><label for="opacity">Opacity</label><input type="range" id="opacity" min="5" max="100" value="100"><output id="opOut">100%</output></div>
      <label class="toggle" id="rowPressure"><input type="checkbox" id="pressure" checked> Pen pressure changes width</label>
    </section>
  </aside>
</div>


<script src="app.js"></script>
</body>
</html>
