<!doctype html>
<html lang="en">
<head>

<title>Gouache Paint</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>

  </div>
  <div class="actions">
  </div>

<div class="app">

      <canvas id="main" width="1400" height="900"></canvas>
      <canvas id="overlay" width="1400" height="900"></canvas>
    </div>
  </div>
</div>


<script src="app.js"></script>

</html>
