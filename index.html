<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gouache Paint</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 28 28'%3E%3Crect x='1' y='1' width='26' height='26' rx='7' fill='%232b3fb8'/%3E%3Cpath d='M7 19c3-1 4-8 8-9s5 4 6 6' fill='none' stroke='%23fff' stroke-width='3' stroke-linecap='round'/%3E%3Ccircle cx='19' cy='9' r='2.5' fill='%23f5c400'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div class="brand">
    <svg width="28" height="28" viewBox="0 0 28 28" aria-hidden="true"><rect x="1" y="1" width="26" height="26" rx="7" fill="var(--accent)"/><path d="M7 19c3-1 4-8 8-9s5 4 6 6" fill="none" stroke="var(--accent-fg)" stroke-width="3" stroke-linecap="round"/><circle cx="19" cy="9" r="2.5" fill="#f5c400"/></svg>
    <h1>Gouache</h1>
    <span class="meta">1400 × 900 px</span>
  </div>
  <div class="actions">
    <button class="btn icon" id="undo" title="Undo (Ctrl+Z)" aria-label="Undo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-3"/></svg></button>
    <button class="btn icon" id="redo" title="Redo (Ctrl+Shift+Z)" aria-label="Redo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 14 5-5-5-5"/><path d="M20 9H9a5 5 0 0 0 0 10h3"/></svg></button>
    <button class="btn" id="clear" title="Clear canvas"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg><span class="lbl">Clear</span></button>
  </div>
</header>

<div class="app">
  <nav class="rail" id="rail" aria-label="Tools"></nav>
  <div class="stage" id="stage">
    <div class="paper" id="paper" data-cursor="ring">
      <canvas id="main" width="1400" height="900"></canvas>
      <canvas id="overlay" width="1400" height="900"></canvas>
      <div class="ring" id="ring" hidden></div>
    </div>
  </div>
  <aside class="panel">
    <section class="sec">
      <h2>Colour</h2>
      <div class="current">
        <div class="big" id="bigSwatch"></div>
        <div>
          <div class="name" id="colorName">Ultramarine</div>
          <div class="hex" id="colorHex">#2B3FB8</div>
        </div>
        <label class="btn custom" title="Pick any colour">Custom<input type="color" id="picker" value="#2b3fb8"></label>
      </div>
      <div class="swatches" id="swatches"></div>
      <div class="recent" id="recent"><span class="empty">Recent colours appear here</span></div>
    </section>
    <section class="sec">
      <h2 id="optTitle">Brush</h2>
      <canvas class="preview" id="preview" width="480" height="112"></canvas>
      <div class="row" id="rowSize"><label for="size">Size</label><input type="range" id="size" min="1" max="160" value="14"><output id="sizeOut">14</output></div>
      <div class="row" id="rowOpacity"><label for="opacity">Opacity</label><input type="range" id="opacity" min="5" max="100" value="100"><output id="opOut">100%</output></div>
      <div class="row" id="rowTol" hidden><label for="tol">Tolerance</label><input type="range" id="tol" min="0" max="128" value="40"><output id="tolOut">40</output></div>
      <label class="toggle" id="rowPressure"><input type="checkbox" id="pressure" checked> Pen pressure changes width</label>
      <label class="toggle" id="rowFillShape" hidden><input type="checkbox" id="fillShape"> Fill the shape</label>
    </section>
  </aside>
</div>

<div class="toast" id="toast" hidden></div>

<script src="app.js"></script>
</body>
</html>
